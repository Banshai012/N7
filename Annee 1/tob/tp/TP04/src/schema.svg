<?xml version='1.0'?>
<!-- Car l'axe des Y est inversé en SVG les y sont transformés en 10 - y
     Toutes les coordonnées sont * 10
-->
<svg xmlns='http://www.w3.org/2000/svg' version="11" width="400" height="250">
	<title>ExempleSchema1.svg</title>
	<desc>Mode SVG</desc>
	<line x1="30" y1="80" x2="60" y2="10" stroke="rgb(255,0,0)"/>
	<line x1="60" y1="10" x2="110" y2="60" stroke="rgb(255,0,0)"/>
	<line x1="110" y1="60" x2="30" y2="80" stroke="rgb(255,0,0)"/>
	<circle cx="66" cy="50" r="2" fill="rgb(0,0,255)"/>
</svg>
